name: deploy-production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Triển khai lên Coolify sau khi publish image
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WEB_IMAGE_NAME: kietphan24/airline-ticket-web
  API_IMAGE_NAME: kietphan24/airline-ticket-api
  PRODUCTION_TAG: production

jobs:
  test-api:
    name: test-api
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Chạy kiểm thử backend
        working-directory: apps/api
        run: mvn -B test

  build-api:
    name: build-api
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Biên dịch backend
        working-directory: apps/api
        run: mvn -B -DskipTests package

  test-web:
    name: test-web
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Chạy kiểm thử web
        working-directory: apps/web
        run: npm exec vitest -- --configLoader runner --run

  build-web:
    name: build-web
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Biên dịch web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://airticket.api.bincrydev.id.vn
        run: npm run build

  validate-production-config:
    name: validate-production-config
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Kiểm tra cấu hình production
        shell: pwsh
        run: ./infra/scripts/kiem-tra-san-sang-production.ps1

  publish-images:
    name: publish-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - test-api
      - test-web
      - build-api
      - build-web
      - validate-production-config

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra cấu hình Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Thiếu secret DOCKERHUB_USERNAME" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Thiếu secret DOCKERHUB_TOKEN" && exit 1)

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Chuẩn bị tag image
        id: image-meta
        shell: bash
        run: echo "sha_tag=production-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build và đẩy image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://airticket.api.bincrydev.id.vn
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:${{ env.PRODUCTION_TAG }}
            ${{ env.WEB_IMAGE_NAME }}:${{ steps.image-meta.outputs.sha_tag }}
          cache-from: type=gha,scope=web-production
          cache-to: type=gha,mode=max,scope=web-production

      - name: Build và đẩy image api
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.API_IMAGE_NAME }}:${{ env.PRODUCTION_TAG }}
            ${{ env.API_IMAGE_NAME }}:${{ steps.image-meta.outputs.sha_tag }}
          cache-from: type=gha,scope=api-production
          cache-to: type=gha,mode=max,scope=api-production

      - name: Ghi tóm tắt image production
        shell: bash
        run: |
          {
            echo "## Image production"
            echo "- Web: \`${{ env.WEB_IMAGE_NAME }}:${{ env.PRODUCTION_TAG }}\`"
            echo "- Web rollback: \`${{ env.WEB_IMAGE_NAME }}:${{ steps.image-meta.outputs.sha_tag }}\`"
            echo "- API: \`${{ env.API_IMAGE_NAME }}:${{ env.PRODUCTION_TAG }}\`"
            echo "- API rollback: \`${{ env.API_IMAGE_NAME }}:${{ steps.image-meta.outputs.sha_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-images:
    name: deploy-images
    runs-on: ubuntu-latest
    needs:
      - publish-images
    if: github.event_name == 'push' || inputs.deploy

    steps:
      - name: Kiểm tra webhook Coolify
        shell: bash
        env:
          WEB_WEBHOOK: ${{ secrets.COOLIFY_WEB_PRODUCTION_WEBHOOK_URL }}
          API_WEBHOOK: ${{ secrets.COOLIFY_API_PRODUCTION_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          test -n "$WEB_WEBHOOK" || (echo "Thiếu secret COOLIFY_WEB_PRODUCTION_WEBHOOK_URL" && exit 1)
          test -n "$API_WEBHOOK" || (echo "Thiếu secret COOLIFY_API_PRODUCTION_WEBHOOK_URL" && exit 1)
          test -n "$COOLIFY_TOKEN" || (echo "Thiếu secret COOLIFY_TOKEN" && exit 1)

      - name: Triển khai image API qua Coolify
        shell: bash
        env:
          API_WEBHOOK: ${{ secrets.COOLIFY_API_PRODUCTION_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: >-
          curl --fail --show-error --silent
          --request POST
          --header "Authorization: Bearer $COOLIFY_TOKEN"
          "$API_WEBHOOK"

      - name: Triển khai image web qua Coolify
        shell: bash
        env:
          WEB_WEBHOOK: ${{ secrets.COOLIFY_WEB_PRODUCTION_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: >-
          curl --fail --show-error --silent
          --request POST
          --header "Authorization: Bearer $COOLIFY_TOKEN"
          "$WEB_WEBHOOK"
